<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Ledger</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Apply saved theme BEFORE first paint so there is no flash/flicker -->
<script>
  try {
    const s = JSON.parse(localStorage.getItem('budgetLedger.v1') || '{}');
    if (s.theme) document.documentElement.dataset.theme = s.theme;
    if (s.accent) document.documentElement.dataset.accent = s.accent;
  } catch (e) {}
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="silk" aria-hidden="true"></canvas>
<div class="wrap">

  <!-- ===== Header: title, month picker, theme, settings ===== -->
  <header>
    <h1>Budget Ledger</h1>
    <div class="tools">
      <input type="month" id="month" aria-label="Select month">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Budget status bar ===== -->
  <section class="card" aria-live="polite">
    <div class="remaining-label" id="remLabel">Remaining this month</div>
    <div class="remaining" id="remaining">৳0</div>
    <div class="bar" role="progressbar" aria-label="Budget remaining" aria-valuemin="0" aria-valuemax="100" id="barWrap"><i id="barFill"></i></div>
    <div class="stats">
      <div class="stat"><small>Monthly budget</small>
        <span class="edit"><b id="budget">৳0</b>
          <button class="icon-btn" id="editBudget" aria-label="Edit monthly budget" title="Edit budget">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button></span></div>
      <div class="stat"><small>Spent</small><b id="spent">৳0</b></div>
      <div class="stat"><small>Used</small><b id="pct">0%</b></div>
    </div>
  </section>

  <!-- ===== Expense entry form ===== -->
  <section class="card">
    <form id="form" novalidate>
      <div class="field"><span class="cur">৳</span>
        <input class="money" id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount" aria-label="Amount"></div>
      <input id="desc" type="text" maxlength="80" placeholder="What did you spend on?" aria-label="Description" autocomplete="off">
      <button class="btn add" type="submit">Add expense</button>
      <label class="date-row">Date &amp; time <input type="datetime-local" id="when"></label>
      <div class="err" id="err" role="alert"></div>
    </form>
  </section>

  <!-- ===== Expense list ===== -->
  <section class="card">
    <div class="list-head">
      <h2 id="listTitle">Expenses</h2>
      <button class="link" id="clearAll">Clear all</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<!-- ===== Dialog: edit budget ===== -->
<dialog id="budgetDlg">
  <form id="budgetForm" novalidate style="display:block">
    <h3>Monthly budget</h3>
    <p id="budgetMonth"></p>
    <div class="field"><span class="cur">৳</span>
      <input class="money" id="budgetInput" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 30000"></div>
    <div class="err" id="budgetErr" role="alert" style="margin-top:8px"></div>
    <div class="actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn">Save budget</button>
    </div>
  </form>
</dialog>

<!-- ===== Dialog: generic confirm ===== -->
<dialog id="confirmDlg">
  <h3 id="cTitle"></h3><p id="cText"></p>
  <div class="actions">
    <button class="btn ghost" data-close>Cancel</button>
    <button class="btn danger" id="cOk">Confirm</button>
  </div>
</dialog>

<!-- ===== Dialog: settings ===== -->
<dialog id="settingsDlg">
  <h3>Settings</h3>
  <div class="setting">Accent color
    <div class="swatches">
      <button class="sw" data-a="emerald" style="background:#10b981" aria-label="Emerald"></button>
      <button class="sw" data-a="violet"  style="background:#8b5cf6" aria-label="Violet"></button>
      <button class="sw" data-a="cyan"    style="background:#06b6d4" aria-label="Cyan"></button>
      <button class="sw" data-a="amber"   style="background:#f97316" aria-label="Sunset amber"></button>
    </div></div>
  <div class="setting">Currency: Bangladeshi Taka (৳)</div>
  <div class="setting">Month
    <div class="month-actions">
      <button class="btn ghost" id="nextMonth">Archive &amp; start next month</button>
      <button class="btn ghost" id="clearMonth">Clear this month's expenses</button>
    </div></div>
  <div class="actions"><button class="btn" data-close>Done</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
